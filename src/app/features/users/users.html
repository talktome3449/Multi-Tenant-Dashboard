<div class="table-toolbar">
    <mat-form-field>
        <mat-label>Search User</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search....." #input>
      </mat-form-field>
    <div class="toolbar-actions">
        <mat-form-field>
            <mat-label>Sort By</mat-label>
            <mat-select (selectionChange)="onSortChange($event.value)">
                <mat-option value="username">Name</mat-option>
                <mat-option value="role">Role</mat-option>
                <mat-option value="status">Status</mat-option>
            </mat-select>
        </mat-form-field>
        <button mat-flat-button (click)="addUser()">
            <mat-icon>add</mat-icon>
            Add User
        </button>
    </div>
</div>

<mat-card class="table-wrapper">
    @if(isLoading()) {
    <div class="table-loader">
        <mat-spinner diameter="50"></mat-spinner>
    </div>
    }
    <section class="table-container">
        <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="username">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
                <td mat-cell *matCellDef="let row">{{ row.userName | titlecase }}</td>
            </ng-container>
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let row">{{ row.email }}</td>
            </ng-container>
            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
                <td mat-cell *matCellDef="let row">{{ row.role }}</td>
            </ng-container>
            <ng-container matColumnDef="tenant">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Tenant</th>
                <td mat-cell *matCellDef="let row">{{ row.tenant }}</td>
            </ng-container>
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                <td mat-cell *matCellDef="let row">
                    <mat-chip [class]="getStatusClass(row.status)">{{ row.status }}</mat-chip>
                </td>
            </ng-container>
            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Action</th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button (click)="editUser(row)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button (click)="deleteUser(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                    @if(!isLoading()) {
                    <div class="empty-state">
                        <img src="images/no-data.svg" alt="No Data" />
                        <h3>No Data Available</h3>
                        <p>Users are not present</p>
                    </div>
                    }
                </td>
            </tr>
        </table>
    </section>

    <mat-paginator [pageSize]="5" showFirstLastButtons />
</mat-card>
